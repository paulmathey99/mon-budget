<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f4b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mon Budget"><link rel="manifest" href="manifest.webmanifest"><title>Mon Budget</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17353d;background:#edf3f3}*{box-sizing:border-box}body{margin:0}.app{max-width:580px;margin:auto;min-height:100dvh;padding:18px 16px 110px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:12px 0}.muted{color:#647981;font-size:13px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0b32300b}.hero{background:#123f4b;color:white}.hero .muted{color:#c5d9da}.big{font-size:32px;font-weight:750;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.small{font-size:13px}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input,select{font:inherit;width:100%;padding:12px;border:1px solid #d5dfdf;border-radius:11px;background:#fff;color:#18343c}button{font:inherit;border:0;border-radius:11px;background:#123f4b;color:white;padding:12px 15px;font-weight:650;cursor:pointer}button.secondary{background:#e6eeee;color:#123f4b}button.danger{background:#fce9e9;color:#a13535}button:disabled{opacity:.5}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d9e4e4;display:flex;justify-content:space-around;padding:10px 5px max(12px,env(safe-area-inset-bottom));z-index:3}nav button{background:none;color:#657b80;padding:8px 3px;font-size:11px;flex:1}nav button.active{color:#087d75;font-weight:800}.bar{height:9px;border-radius:20px;background:#e2eaea;overflow:hidden;margin:9px 0}.bar span{display:block;height:100%;background:#159b84;border-radius:20px}.item{border-bottom:1px solid #e7eeee;padding:12px 0}.item:last-child{border:0}.pill{font-size:12px;background:#e6f4ef;color:#126c5e;padding:5px 8px;border-radius:20px}.negative{color:#b53f40}.positive{color:#13816d}.hidden{display:none}.notice{font-size:12px;color:#6b7379;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:13px}.space{height:12px}</style></head><body><div class="app"><header><div><div class="muted">APPLICATION DE DÉMONSTRATION</div><h1>Mon Budget</h1></div><span class="pill">V1</span></header><main id="content"></main></div><nav id="nav"></nav><script>
const KEY="mon-budget-demo-v1";
const initial={salary:2800,charges:1200,payday:27,periodStart:"2026-11-27",taxTarget:720,taxSaved:300,taxReserve:80,estimatedTax:3600,withheldTax:2880,transactions:[{id:1,label:"Carrefour",amount:62.4,category:"Courses",date:"2026-11-18"},{id:2,label:"Restaurant",amount:38.5,category:"Restaurants",date:"2026-11-17"},{id:3,label:"Navigo",amount:86.4,category:"Transports",date:"2026-11-16"}],projects:[{id:1,name:"Canapé",target:1200,saved:250,deadline:"2027-03-31"},{id:2,name:"Vacances",target:1500,saved:400,deadline:"2027-06-30"}],budgets:{Courses:400,Restaurants:200,Transports:150,Loisirs:180,Shopping:200,Santé:100,Autres:100}};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){state=structuredClone(initial)};let tab="home";
const detailedCategories=["Courses alimentaires","Hygiène et entretien","Restaurants et livraison","Cafés et snacks","Transports en commun","Carburant et voiture","Logement","Énergie et factures","Téléphone et internet","Abonnements numériques","Santé et pharmacie","Vêtements","Shopping et équipement","Sorties et culture","Sport","Vacances et voyages","Cadeaux","Animaux","Autres","Courses","Restaurants","Transports","Loisirs","Shopping","Santé"];const cats=detailedCategories, euro=x=>Number(x||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"}), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const spent=()=>state.transactions.reduce((a,t)=>a+Number(t.amount),0), reserved=()=>state.projects.reduce((a,p)=>a+Number(p.saved),0), available=()=>state.salary-state.charges-state.taxReserve-spent(), unreserved=()=>Math.max(0,available()-reserved());
const bar=(a,b)=>'<div class="bar"><span style="width:'+Math.min(100,Math.max(0,b?100*a/b:0))+'%"></span></div>';
function render(){const tabs=[["home","⌂","Accueil"],["transactions","⇄","Opérations"],["budgets","▤","Budgets"],["projects","◈","Épargne"],["tax","▥","Impôts"],["assistant","✦","Assistant"]];document.getElementById("nav").innerHTML=tabs.map(t=>'<button class="'+(tab===t[0]?'active':'')+'" onclick="navigate(\''+t[0]+'\')"><div style="font-size:21px">'+t[1]+'</div>'+t[2]+'</button>').join("");document.getElementById("content").innerHTML=({home:home,transactions:transactions,budgets:budgets,projects:projects,tax:tax,assistant:assistantBudget})[tab]();}
function navigate(t){tab=t;render();scrollTo(0,0)}
function home(){return '<section class="card hero"><div class="muted">Budget restant après charges et provision fiscale</div><div class="big">'+euro(available())+'</div><div class="muted">Période du salaire au salaire · simulation</div></section><div class="grid"><div class="card"><div class="muted">Salaire</div><h2>'+euro(state.salary)+'</h2></div><div class="card"><div class="muted">Dépenses variables</div><h2>'+euro(spent())+'</h2></div><div class="card"><div class="muted">Charges prévues</div><h2>'+euro(state.charges)+'</h2></div><div class="card"><div class="muted">Provision fiscale</div><h2>'+euro(state.taxReserve)+'</h2></div></div><section class="card"><h2>Paramètres</h2><label>Salaire net reçu (€)</label><input type="number" min="0" value="'+state.salary+'" onchange="setNum(\'salary\',this.value)"><label>Charges encore à payer (€)</label><input type="number" min="0" value="'+state.charges+'" onchange="setNum(\'charges\',this.value)"><label>Jour habituel du salaire</label><input type="number" min="1" max="28" value="'+state.payday+'" onchange="setNum(\'payday\',this.value)"></section><p class="notice">Le solde bancaire n’est pas synchronisé. Le budget disponible est une estimation, pas un solde réel. Les cagnottes sont virtuelles et ne déclenchent aucun virement.</p>'}
function setNum(k,v){state[k]=Math.max(0,Number(v)||0);save();render()}
function guess(label){const s=label.toLowerCase();if(/carrefour|auchan|lidl|monoprix|intermarch|supermarch|franprix/.test(s))return"Courses";if(/restau|café|cafe|uber eats|deliveroo|pizza/.test(s))return"Restaurants";if(/navigo|sncf|ratp|essence|uber|totalenergies station/.test(s))return"Transports";if(/cinéma|cinema|netflix|spotify|concert/.test(s))return"Loisirs";if(/pharmacie|médecin|medecin|docteur/.test(s))return"Santé";if(/amazon|fnac|zara|ikea/.test(s))return"Shopping";return"Autres"}
function transactions(){return '<h2>Opérations</h2><div class="card"><form onsubmit="addTx(event)"><label>Libellé</label><input name="label" required placeholder="Ex. Carrefour"><label>Montant de la dépense (€)</label><input name="amount" type="number" min=".01" step=".01" required><label>Date</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required><div class="space"></div><button>Ajouter et catégoriser</button></form></div><div class="card"><h2>Historique · '+euro(spent())+'</h2>'+state.transactions.map(t=>'<div class="item"><div class="row"><div><b>'+esc(t.label)+'</b><div class="muted">'+esc(t.date)+'</div></div><b>−'+euro(t.amount)+'</b></div><div class="row"><select aria-label="Catégorie" onchange="changeCategory('+t.id+',this.value)">'+cats.map(c=>'<option '+(c===t.category?'selected':'')+'>'+c+'</option>').join('')+'</select><button class="danger" onclick="deleteTx('+t.id+')">Supprimer</button></div></div>').join('')+'</div>'}
function addTx(e){e.preventDefault();const f=new FormData(e.target),label=String(f.get("label")).trim(),amount=Number(f.get("amount"));if(!label||!(amount>0))return;state.transactions.unshift({id:Date.now(),label,amount,category:guess(label),date:String(f.get("date"))});save();render()}
function deleteTx(id){state.transactions=state.transactions.filter(x=>x.id!==id);save();render()}
function changeCategory(id,c){const t=state.transactions.find(x=>x.id===id);if(t)t.category=c;save();render()}
function budgets(){return '<h2>Budgets par catégorie</h2><p class="muted">Les dépenses sont regroupées automatiquement ; tu peux corriger leur catégorie dans Opérations.</p>'+cats.map(c=>{const used=state.transactions.filter(t=>t.category===c).reduce((a,t)=>a+t.amount,0);return '<div class="card"><div class="row"><b>'+c+'</b><span>'+euro(used)+' / '+euro(state.budgets[c])+'</span></div>'+bar(used,state.budgets[c])+'<label>Enveloppe (€)</label><input type="number" min="0" value="'+state.budgets[c]+'" onchange="setBudget(\''+c+'\',this.value)"></div>'}).join('')}
function setBudget(c,v){state.budgets[c]=Math.max(0,Number(v)||0);save();render()}
function projects(){return '<h2>Mes cagnottes projets</h2><p class="muted">Épargne virtuelle affectée : '+euro(reserved())+'. Priorité à la réserve fiscale avant tout nouveau versement.</p>'+state.projects.map(p=>{const left=Math.max(0,p.target-p.saved),today=new Date(),end=new Date(p.deadline+"T12:00:00"),months=Math.max(1,Math.ceil((end-today)/86400000/30.44));return '<div class="card"><div class="row"><b>'+esc(p.name)+'</b><span class="pill">'+Math.round(p.saved/p.target*100)+' %</span></div>'+bar(p.saved,p.target)+'<div class="row small"><span>'+euro(p.saved)+' / '+euro(p.target)+'</span><span>'+esc(p.deadline)+'</span></div><p class="muted">Suggestion : '+euro(left/months)+' par salaire (approximation)</p><div class="actions"><button class="secondary" onclick="fund('+p.id+')">Réserver un montant</button><button class="danger" onclick="removeProject('+p.id+')">Supprimer</button></div></div>'}).join('')+'<div class="card"><h2>Créer une cagnotte</h2><form onsubmit="addProject(event)"><label>Nom</label><input name="name" required><label>Objectif (€)</label><input name="target" type="number" min="1" step=".01" required><label>Échéance</label><input name="deadline" type="date" required><div class="space"></div><button>Créer</button></form></div><p class="notice">Les sommes réservées sont des affectations virtuelles. La V1 ne vérifie pas ton solde bancaire réel.</p>'}
function addProject(e){e.preventDefault();const f=new FormData(e.target);state.projects.push({id:Date.now(),name:String(f.get("name")).trim(),target:Number(f.get("target")),saved:0,deadline:String(f.get("deadline"))});save();render()}
function removeProject(id){if(!confirm("Supprimer cette cagnotte virtuelle ?"))return;state.projects=state.projects.filter(x=>x.id!==id);save();render()}
function fund(id){const p=state.projects.find(x=>x.id===id),v=Number(prompt("Montant à réserver en € (maximum conseillé : "+euro(unreserved())+")","50"));if(!(v>0))return;if(v>Math.max(0,available()-reserved())){alert("Montant indisponible après la réserve fiscale et les autres cagnottes.");return}p.saved=Math.min(p.target,p.saved+v);save();render()}
function tax(){const due=Math.max(0,state.estimatedTax-state.withheldTax),left=Math.max(0,due-state.taxSaved);return '<h2>Suivi fiscal</h2><div class="card"><div class="muted">Complément d’impôt anticipé</div><div class="big">'+euro(due)+'</div><p class="notice">Estimation saisie manuellement : ce prototype ne calcule pas encore le barème officiel, ni les crédits d’impôt.</p></div><div class="card"><label>Impôt annuel estimé (€)</label><input type="number" min="0" value="'+state.estimatedTax+'" onchange="setNum(\'estimatedTax\',this.value)"><label>Prélèvements à la source annuels estimés (€)</label><input type="number" min="0" value="'+state.withheldTax+'" onchange="setNum(\'withheldTax\',this.value)"><label>Réserve fiscale déjà constituée (€)</label><input type="number" min="0" value="'+state.taxSaved+'" onchange="setNum(\'taxSaved\',this.value)"></div><div class="card"><div class="row"><b>Reste à provisionner</b><b>'+euro(left)+'</b></div>'+bar(state.taxSaved,due)+'<p>Suggestion sur six salaires : <b>'+euro(left/6)+'</b> par salaire</p><label>Provision prioritaire dans le budget actuel (€)</label><input type="number" min="0" value="'+state.taxReserve+'" onchange="setNum(\'taxReserve\',this.value)"></div><p class="notice">Le net imposable et les retenues sur fiche de paie ne peuvent pas être déduits du seul solde BNP Paribas. Ne pas utiliser cette estimation pour déclarer ses impôts.</p>'}

const categoryGroups={
"Courses alimentaires":"Essentiel","Hygiène et entretien":"Essentiel","Restaurants et livraison":"Plaisir","Cafés et snacks":"Plaisir","Transports en commun":"Mobilité","Carburant et voiture":"Mobilité","Logement":"Fixe","Énergie et factures":"Fixe","Téléphone et internet":"Fixe","Abonnements numériques":"Abonnements","Santé et pharmacie":"Santé","Vêtements":"Personnel","Shopping et équipement":"Personnel","Sorties et culture":"Plaisir","Sport":"Plaisir","Vacances et voyages":"Projet","Cadeaux":"Plaisir","Animaux":"Essentiel","Autres":"Divers"
};
const oldCategoryMap={"Courses":"Courses alimentaires","Restaurants":"Restaurants et livraison","Transports":"Transports en commun","Loisirs":"Sorties et culture","Shopping":"Shopping et équipement","Santé":"Santé et pharmacie"};
const defaults={household:1,food:"normal",restaurants:"sometimes",transport:"public",leisure:"normal",shopping:"normal",savings:"balanced",health:"normal",subscriptions:"normal",car:false,animals:false};
state.quiz=Object.assign({},defaults,state.quiz||{});
for(const c of Object.keys(categoryGroups))if(state.budgets[c]===undefined)state.budgets[c]=0;
if(!state.categoryVersion){state.transactions.forEach(t=>{t.category=oldCategoryMap[t.category]||t.category});for(const [a,b] of Object.entries(oldCategoryMap)){if(state.budgets[a]&&state.budgets[b]===0)state.budgets[b]=state.budgets[a];delete state.budgets[a]}state.categoryVersion=2;save()}
function guess(label){const s=label.toLowerCase();if(/carrefour|auchan|lidl|monoprix|intermarch|supermarch|franprix|picard|leclerc|biocoop/.test(s))return"Courses alimentaires";if(/pharmacie|médecin|medecin|docteur|optique|dentiste/.test(s))return"Santé et pharmacie";if(/restau|uber eats|deliveroo|pizza|brasserie|bistro/.test(s))return"Restaurants et livraison";if(/café|cafe|boulangerie|starbucks/.test(s))return"Cafés et snacks";if(/navigo|sncf|ratp|transilien|metro|métro/.test(s))return"Transports en commun";if(/essence|station service|totalenergies|parking|péage|peage/.test(s))return"Carburant et voiture";if(/netflix|spotify|disney|youtube premium|prime video|deezer/.test(s))return"Abonnements numériques";if(/cinéma|cinema|concert|musée|musee|théâtre|theatre/.test(s))return"Sorties et culture";if(/amazon|fnac|ikea|darty/.test(s))return"Shopping et équipement";if(/zara|uniqlo|h&m|kiabi/.test(s))return"Vêtements";if(/orange|sfr|bouygues telecom|free mobile/.test(s))return"Téléphone et internet";if(/loyer|agence immobilière|agence immobiliere/.test(s))return"Logement";return"Autres"}
function budgets(){const active=Object.keys(categoryGroups);return '<div class="row"><h2>Budgets détaillés</h2><button onclick="navigate(\'assistant\')">✦ Calculateur</button></div><p class="muted">Les catégories sont ajustables. Le calculateur propose une répartition personnalisée.</p><div class="card"><b>Total des enveloppes : '+euro(active.reduce((a,c)=>a+(Number(state.budgets[c])||0),0))+'</b><div class="muted">Disponible pour les dépenses variables : '+euro(Math.max(0,state.salary-state.charges-state.taxReserve))+'</div></div>'+active.map(c=>{const used=state.transactions.filter(t=>t.category===c).reduce((a,t)=>a+t.amount,0),budget=Number(state.budgets[c])||0;return '<div class="card"><div class="row"><div><b>'+c+'</b><div class="muted">'+categoryGroups[c]+'</div></div><span class="'+(used>budget?'negative':'')+'">'+euro(used)+' / '+euro(budget)+'</span></div>'+bar(used,budget)+'<label>Enveloppe (€)</label><input type="number" min="0" step="1" value="'+budget+'" onchange="setBudget(\''+c+'\',this.value)"></div>'}).join('')}
function question(key,label,options){return '<label>'+label+'</label><select onchange="setQuiz(\''+key+'\',this.value)">'+options.map(([v,t])=>'<option value="'+v+'" '+(String(state.quiz[key])===String(v)?'selected':'')+'>'+t+'</option>').join('')+'</select>'}
function setQuiz(k,v){state.quiz[k]=k==="household"?Math.max(1,Math.min(8,Number(v)||1)):v;save();render()}
const levels=[["low","Faible"],["normal","Modéré"],["high","Important"]];
function assistantBudget(){const q=state.quiz;return '<h2>✦ Calculateur intelligent</h2><p class="muted">Un questionnaire pour répartir ton budget selon tes habitudes et tes priorités. Les montants sont des recommandations, pas des normes.</p><div class="card"><h2>1. Ton foyer</h2>'+question("household","Combien de personnes financées par ce budget ?",[[1,"1 personne"],[2,"2 personnes"],[3,"3 personnes"],[4,"4 personnes"],[5,"5 personnes ou plus"]])+question("food","Budget alimentaire habituel",levels)+question("restaurants","Restaurants et livraisons",[["rare","Rarement"],["sometimes","Parfois"],["often","Souvent"]])+question("transport","Déplacement principal",[["public","Transports en commun"],["car","Voiture"],["both","Les deux"],["walk","Marche ou vélo"]])+'</div><div class="card"><h2>2. Tes habitudes</h2>'+question("leisure","Sorties, culture et sport",levels)+question("shopping","Vêtements et achats personnels",levels)+question("health","Dépenses de santé non remboursées",levels)+question("subscriptions","Abonnements numériques",levels)+question("animals","As-tu des animaux ?",[["false","Non"],["true","Oui"]])+'</div><div class="card"><h2>3. Ta priorité</h2>'+question("savings","Que souhaites-tu privilégier ?",[["security","Une marge de sécurité"],["balanced","Un équilibre"],["projects","Les projets et loisirs"]])+'</div><div class="card"><h2>4. Proposition</h2><div class="row"><span>Revenus</span><b>'+euro(state.salary)+'</b></div><div class="row"><span>Charges encore à payer</span><b>'+euro(state.charges)+'</b></div><div class="row"><span>Provision fiscale prioritaire</span><b>'+euro(state.taxReserve)+'</b></div><hr><div class="row"><b>Montant à répartir</b><b>'+euro(Math.max(0,state.salary-state.charges-state.taxReserve))+'</b></div><p class="notice">Les charges fixes sont saisies globalement dans Accueil : ne les saisis pas une seconde fois dans les enveloppes variables. Les cagnottes déjà constituées ne sont pas des dépenses de la période.</p><button onclick="proposeBudget()">Calculer ma répartition</button><div id="proposal">'+(state.proposal?proposalHTML():'')+'</div></div>'}
function proposeBudget(){const q=state.quiz;const pool=Math.max(0,state.salary-state.charges-state.taxReserve),n=Math.max(1,Number(q.household)||1);const factor=x=>x==="low"?.7:x==="high"?1.4:1;const w={"Courses alimentaires":5*n**.65*factor(q.food),"Hygiène et entretien":1.1*n**.4,"Restaurants et livraison":q.restaurants==="rare"?.45:q.restaurants==="often"?2.8:1.3,"Cafés et snacks":q.restaurants==="rare"?.3:q.restaurants==="often"?1.5:.7,"Transports en commun":q.transport==="public"?2.8:q.transport==="both"?1.5:q.transport==="walk"?.3:.4,"Carburant et voiture":q.transport==="car"?3.8:q.transport==="both"?2.2:.1,"Santé et pharmacie":1.1*factor(q.health),"Vêtements":1.1*factor(q.shopping),"Shopping et équipement":1.2*factor(q.shopping),"Sorties et culture":1.7*factor(q.leisure),"Sport":.9*factor(q.leisure),"Vacances et voyages":q.savings==="projects"?2.3:1.2,"Cadeaux":.7,"Animaux":q.animals==="true"?1.2:0,"Abonnements numériques":1.1*factor(q.subscriptions),"Autres":.9};const safety=q.savings==="security"?.2:q.savings==="projects"?.06:.12;const alloc=pool*(1-safety),total=Object.values(w).reduce((a,b)=>a+b,0);const proposed={};let assigned=0;for(const c of Object.keys(categoryGroups)){const v=Math.floor((w[c]||0)/total*alloc);proposed[c]=v;assigned+=v}state.proposal={budgets:proposed,margin:Math.round(pool-assigned),pool};save();render()}
function proposalHTML(){const p=state.proposal;if(!p)return"";return '<div class="space"></div><h2>Répartition suggérée</h2><div class="row"><b>Marge de sécurité non affectée</b><b>'+euro(p.margin)+'</b></div>'+Object.entries(p.budgets).filter(([c,v])=>v>0).map(([c,v])=>'<div class="row item"><span>'+c+'</span><b>'+euro(v)+'</b></div>').join('')+'<div class="space"></div><button onclick="applyProposal()">Appliquer ces enveloppes</button> <button class="secondary" onclick="state.proposal=null;save();render()">Refuser</button><p class="notice">Les enveloppes restent modifiables individuellement dans Budgets. La marge de sécurité n’est pas dépensée ni transférée.</p>'}
function applyProposal(){if(!state.proposal)return;Object.assign(state.budgets,state.proposal.budgets);state.proposal=null;save();navigate("budgets")}

render();if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
